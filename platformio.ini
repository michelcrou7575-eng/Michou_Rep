; TGIS-510 (Thermal Glue Inspection System)
; Home-lab / after-hours project. Separate from the 410 Rotaliner Tubing Seal
; Seam Monitor (factory floor, S7-300/ATmega2560) -- do not conflate.
;
; PLACEHOLDER: `board` is a generic ESP32-S3 dev board definition. Swap for the
; exact "ESP32-S3-Zero-M (ESP32-S3FH4R2)" board once its PlatformIO board id
; is confirmed / a custom board JSON is added to boards/.
;
; NOT a placeholder -- CONFIRMED from a real boot failure (2026-09):
; "esp32-s3-devkitc-1"'s default flash/PSRAM sizing does not match this
; chip. ESP32-S3FH4R2 decodes as Flash=4MB, PSRAM=2MB (Quad, not Octal).
; The generic devkit board defaults to 8MB flash, which produced:
;   spi_flash: Detected size(4096k) smaller than the size in the binary
;   image header(8192k). Probe failed.
;   assert failed: do_core_init startup.c:328 (flash_ret == ESP_OK)
; i.e. a boot-time crash before any application code runs, on every boot.
; The overrides below set the real 4MB/2MB-Quad-PSRAM sizing regardless of
; which generic board definition sits underneath; re-verify if `board` is
; ever swapped for a proper ESP32-S3-Zero-M definition.

[env:tgis510]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags =
    -D FW_VERSION_STRING=\"V4.15.1\"
    -D FW_FILE_STRING=\"tgis510_v4_15_1.cpp\"
lib_deps =
    adafruit/Adafruit MLX90640@^1.1.1
    adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit NeoPixel@^1.12.0
